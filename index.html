<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Business Scanner</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --primary: #6366f1;
        --primary-dark: #4f46e5;
        --secondary: #8b5cf6;
        --success: #10b981;
        --error: #ef4444;
        --warning: #f59e0b;
        --dark: #1e293b;
        --light: #f8fafc;
        --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1),
          0 10px 10px -5px rgba(0, 0, 0, 0.04);
      }

      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        position: relative;
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: absolute;
        width: 200%;
        height: 200%;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.1) 1px,
          transparent 1px
        );
        background-size: 50px 50px;
        animation: moveGrid 20s linear infinite;
        pointer-events: none;
      }

      @keyframes moveGrid {
        0% {
          transform: translate(0, 0);
        }
        100% {
          transform: translate(50px, 50px);
        }
      }

      .container {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 24px;
        box-shadow: var(--shadow);
        padding: 40px;
        width: 100%;
        max-width: 1200px;
        position: relative;
        animation: slideUp 0.6s ease-out;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      h1 {
        background: linear-gradient(
          135deg,
          var(--primary) 0%,
          var(--secondary) 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 10px;
        text-align: center;
        font-size: 36px;
        font-weight: 700;
        letter-spacing: -0.5px;
      }

      .subtitle {
        text-align: center;
        color: #64748b;
        margin-bottom: 40px;
        font-size: 16px;
      }

      .search-section {
        display: grid;
        grid-template-columns: 2fr 1fr auto;
        gap: 20px;
        margin-bottom: 40px;
        align-items: end;
      }

      .form-group {
        display: flex;
        flex-direction: column;
      }

      label {
        font-weight: 600;
        margin-bottom: 10px;
        color: var(--dark);
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      label::before {
        content: "";
        width: 4px;
        height: 16px;
        background: var(--primary);
        border-radius: 2px;
      }

      select {
        padding: 14px 18px;
        border: 2px solid #e2e8f0;
        border-radius: 12px;
        font-size: 15px;
        transition: all 0.3s;
        background: white;
        cursor: pointer;
      }

      select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
      }

      #imagePreview {
        border: 3px dashed #e2e8f0;
        border-radius: 16px;
        padding: 30px;
        text-align: center;
        cursor: pointer;
        min-height: 140px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        transition: all 0.3s;
        background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
        position: relative;
        overflow: hidden;
      }

      #imagePreview::before {
        content: "";
        position: absolute;
        inset: -2px;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        border-radius: 16px;
        opacity: 0;
        transition: opacity 0.3s;
        z-index: -1;
      }

      #imagePreview:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.2);
      }

      #imagePreview:hover::before {
        opacity: 0.1;
      }

      #imagePreview.drag-over {
        border-color: var(--primary);
        background: rgba(99, 102, 241, 0.05);
      }

      #imagePreview img {
        max-width: 100%;
        max-height: 180px;
        border-radius: 12px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      }

      .upload-icon {
        width: 64px;
        height: 64px;
        margin-bottom: 16px;
        opacity: 0.5;
        transition: all 0.3s;
      }

      #imagePreview:hover .upload-icon {
        opacity: 0.8;
        transform: scale(1.05);
      }

      button {
        padding: 14px 32px;
        background: linear-gradient(
          135deg,
          var(--primary) 0%,
          var(--secondary) 100%
        );
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        box-shadow: 0 4px 6px -1px rgba(99, 102, 241, 0.3);
        position: relative;
        overflow: hidden;
      }

      button::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.3),
          transparent
        );
        transition: left 0.5s;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
      }

      button:hover::before {
        left: 100%;
      }

      button:disabled {
        background: #cbd5e1;
        cursor: not-allowed;
        box-shadow: none;
        transform: none;
      }

      .status-bar {
        padding: 18px 24px;
        border-radius: 12px;
        margin-bottom: 30px;
        display: none;
        align-items: center;
        gap: 12px;
        font-weight: 500;
        animation: slideIn 0.3s ease-out;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateX(-20px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      .status-bar.active {
        display: flex;
      }

      .status-bar.success {
        background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%);
        color: #065f46;
        border: 1px solid #6ee7b7;
      }

      .status-bar.error {
        background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
        color: #991b1b;
        border: 1px solid #f87171;
      }

      .status-bar.loading {
        background: linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 100%);
        color: #3730a3;
        border: 1px solid #a5b4fc;
      }

      .loading-spinner {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 3px solid rgba(99, 102, 241, 0.3);
        border-top: 3px solid var(--primary);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .results-section {
        display: none;
        animation: fadeIn 0.5s ease-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .results-section.active {
        display: block;
      }

      .results-header {
        margin-bottom: 24px;
      }

      .results-count {
        font-size: 20px;
        font-weight: 600;
        color: var(--dark);
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .results-count::before {
        content: "";
        width: 8px;
        height: 8px;
        background: var(--success);
        border-radius: 50%;
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.2);
          opacity: 0.5;
        }
      }

      .table-container {
        background: white;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.07);
        border: 1px solid #e2e8f0;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th {
        background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
        padding: 18px 24px;
        text-align: left;
        font-weight: 600;
        color: var(--dark);
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        border-bottom: 2px solid #e2e8f0;
      }

      td {
        padding: 16px 24px;
        border-bottom: 1px solid #f1f5f9;
        color: #475569;
        font-size: 15px;
      }

      tr {
        transition: all 0.2s;
      }

      tr:hover {
        background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
      }

      tbody tr {
        animation: slideInRow 0.3s ease-out;
      }

      @keyframes slideInRow {
        from {
          opacity: 0;
          transform: translateX(-20px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      .website-link {
        color: var(--primary);
        text-decoration: none;
        font-weight: 500;
        transition: all 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .website-link::after {
        content: "↗";
        font-size: 12px;
        opacity: 0;
        transform: translate(-4px, -4px);
        transition: all 0.2s;
      }

      .website-link:hover {
        color: var(--primary-dark);
      }

      .website-link:hover::after {
        opacity: 1;
        transform: translate(0, 0);
      }

      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: #94a3b8;
      }

      .empty-state svg {
        width: 120px;
        height: 120px;
        margin-bottom: 20px;
        opacity: 0.3;
      }

      @media (max-width: 768px) {
        .search-section {
          grid-template-columns: 1fr;
        }

        .container {
          padding: 24px;
        }

        h1 {
          font-size: 28px;
        }

        table {
          font-size: 14px;
        }

        td,
        th {
          padding: 12px;
        }
      }

      /* Enter tuşu ile arama yapabilmek için */
      #keywordInput {
        width: 100%;
        padding: 14px 18px;
        border: 2px solid #e2e8f0;
        border-radius: 12px;
        font-size: 15px;
        transition: all 0.3s;
        background: white;
      }

      #keywordInput:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
      }

      .product-tag {
        display: inline-block;
        background: linear-gradient(
          135deg,
          var(--primary) 0%,
          var(--secondary) 100%
        );
        color: white;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        margin-left: 8px;
        animation: popIn 0.3s ease-out;
      }

      @keyframes popIn {
        from {
          transform: scale(0);
        }
        to {
          transform: scale(1);
        }
      }

      .lens-info {
        background: linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 100%);
        border: 1px solid #a5b4fc;
        border-radius: 12px;
        padding: 15px 20px;
        margin-bottom: 30px;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 14px;
        color: #3730a3;
      }

      .back-button {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 8px 16px;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.3s;
        z-index: 1000;
        text-decoration: none;
        color: var(--dark);
      }

      .back-button:hover {
        background: rgba(255, 255, 255, 1);
        border-color: #6366f1;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Business Scanner</h1>
      <p class="subtitle">
        Ürün fotoğrafı veya anahtar kelime ile ilgili şirketleri bulun
      </p>

      <!-- Arama türü seçimi -->
      <div
        style="
          display: flex;
          justify-content: center;
          margin-bottom: 30px;
          gap: 20px;
        "
      >
        <label
          style="
            display: flex;
            align-items: center;
            cursor: pointer;
            font-weight: 500;
            color: var(--dark);
          "
        >
          <input
            type="radio"
            name="searchType"
            value="image"
            checked
            style="margin-right: 8px; cursor: pointer"
          />
          <span>🖼️ Resim ile Ara</span>
        </label>
        <label
          style="
            display: flex;
            align-items: center;
            cursor: pointer;
            font-weight: 500;
            color: var(--dark);
          "
        >
          <input
            type="radio"
            name="searchType"
            value="keyword"
            style="margin-right: 8px; cursor: pointer"
          />
          <span>🔤 Kelime ile Ara</span>
        </label>
      </div>

      <div class="search-section">
        <!-- Resim yükleme alanı -->
        <div class="form-group" id="imageSearchGroup">
          <label for="imageInput">Ürün Fotoğrafı</label>
          <input
            type="file"
            id="imageInput"
            accept="image/*"
            style="display: none"
          />
          <div
            id="imagePreview"
            onclick="document.getElementById('imageInput').click()"
          >
            <div id="previewContent">
              <svg
                class="upload-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="17 8 12 3 7 8" />
                <line x1="12" y1="3" x2="12" y2="15" />
              </svg>
              <p style="color: #94a3b8; font-weight: 500">
                Resim yüklemek için tıklayın veya sürükleyin
              </p>
              <p style="color: #cbd5e1; font-size: 13px; margin-top: 8px">
                PNG, JPG, JPEG (Max. 10MB)
              </p>
            </div>
          </div>
          <input type="hidden" id="sector" value="" />
        </div>

        <!-- Anahtar kelime arama alanı -->
        <div class="form-group" id="keywordSearchGroup" style="display: none">
          <label for="keywordInput">Anahtar Kelime</label>
          <input
            type="text"
            id="keywordInput"
            placeholder="Örn: cam bardak, elektronik, mobilya..."
          />
        </div>

        <div class="form-group">
          <label for="country">Ülke</label>
          <select id="country">
            <option value="TR">🇹🇷 Türkiye</option>
            <option value="DE">🇩🇪 Almanya</option>
            <option value="NL">🇳🇱 Hollanda</option>
            <option value="FR">🇫🇷 Fransa</option>
          </select>
        </div>

        <button id="searchBtn" onclick="startSearch()">
          <span>Aramayı Başlat</span>
        </button>
      </div>

      <div id="statusBar" class="status-bar"></div>

      <div id="resultsSection" class="results-section">
        <div class="results-header">
          <div class="results-count">
            Bulunan: <span id="resultCount">0</span> şirket
            <span
              id="productTag"
              class="product-tag"
              style="display: none"
            ></span>
          </div>
        </div>

        <div class="table-container">
          <div style="overflow-x: auto">
            <table>
              <thead>
                <tr>
                  <th>Şirket Adı</th>
                  <th>Website</th>
                </tr>
              </thead>
              <tbody id="resultsBody"></tbody>
            </table>
          </div>
          <div id="emptyState" class="empty-state" style="display: none">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="11" cy="11" r="8" />
              <path d="m21 21-4.35-4.35" />
            </svg>
            <p style="font-size: 18px; font-weight: 600; margin-bottom: 8px">
              Henüz sonuç yok
            </p>
            <p>Arama tamamlandığında sonuçlar burada görünecek</p>
          </div>
        </div>
      </div>
    </div>

    <script>
      let currentJobId = null;
      let allResults = [];
      let statusCheckInterval = null;
      const API_URL = "http://localhost:5008";
      let selectedImage = null;

      // Sayfa yüklendiğinde lens seçimini kontrol et
      document.addEventListener("DOMContentLoaded", function () {
        // localStorage'dan lens seçimini al
        const lensType = localStorage.getItem("selectedLens") || "custom";

        // Lens bilgisini göster
        showLensInfo(lensType);

        // Geri dönüş butonu ekle
        addBackButton();
      });

      function showLensInfo(lensType) {
        const lensInfo = document.createElement("div");
        lensInfo.className = "lens-info";

        const lensName =
          lensType === "custom" ? "Özel Lens Sistemi" : "Google Lens";
        const lensIcon = lensType === "custom" ? "🔍" : "📷";

        lensInfo.innerHTML = `
                <span style="font-size: 20px;">${lensIcon}</span>
                <span><strong>Aktif Sistem:</strong> ${lensName}</span>
                <button onclick="changeLens()" style="
                    background: rgba(255,255,255,0.8);
                    border: 1px solid #a5b4fc;
                    border-radius: 6px;
                    padding: 4px 12px;
                    font-size: 12px;
                    cursor: pointer;
                    margin-left: auto;
                ">Değiştir</button>
            `;

        // Container'ın başına ekle
        const container = document.querySelector(".container");
        const subtitle = container.querySelector(".subtitle");
        subtitle.after(lensInfo);
      }

      function addBackButton() {
        const backButton = document.createElement("a");
        backButton.href = "/";
        backButton.className = "back-button";
        backButton.innerHTML = "← Lens Seçimine Dön";

        document.body.appendChild(backButton);
      }

      function changeLens() {
        if (
          confirm(
            "Lens sistemini değiştirmek için ana sayfaya dönmek istediğinizden emin misiniz?"
          )
        ) {
          window.location.href = "/";
        }
      }

      // Radio button değişimlerini dinle
      document.querySelectorAll('input[name="searchType"]').forEach((radio) => {
        radio.addEventListener("change", function () {
          const imageGroup = document.getElementById("imageSearchGroup");
          const keywordGroup = document.getElementById("keywordSearchGroup");

          if (this.value === "image") {
            imageGroup.style.display = "block";
            keywordGroup.style.display = "none";
          } else {
            imageGroup.style.display = "none";
            keywordGroup.style.display = "block";
          }
        });
      });

      // Drag and drop functionality
      const imagePreview = document.getElementById("imagePreview");

      ["dragenter", "dragover", "dragleave", "drop"].forEach((eventName) => {
        imagePreview.addEventListener(eventName, preventDefaults, false);
        document.body.addEventListener(eventName, preventDefaults, false);
      });

      function preventDefaults(e) {
        e.preventDefault();
        e.stopPropagation();
      }

      ["dragenter", "dragover"].forEach((eventName) => {
        imagePreview.addEventListener(eventName, highlight, false);
      });

      ["dragleave", "drop"].forEach((eventName) => {
        imagePreview.addEventListener(eventName, unhighlight, false);
      });

      function highlight(e) {
        imagePreview.classList.add("drag-over");
      }

      function unhighlight(e) {
        imagePreview.classList.remove("drag-over");
      }

      imagePreview.addEventListener("drop", handleDrop, false);

      function handleDrop(e) {
        const dt = e.dataTransfer;
        const files = dt.files;

        if (files.length > 0) {
          handleFile(files[0]);
        }
      }

      // Handle image selection
      document
        .getElementById("imageInput")
        .addEventListener("change", function (e) {
          const file = e.target.files[0];
          if (file) {
            handleFile(file);
          }
        });

      // Enter tuşu ile arama
      document
        .getElementById("keywordInput")
        .addEventListener("keypress", function (e) {
          if (e.key === "Enter") {
            startSearch();
          }
        });

      function handleFile(file) {
        if (!file.type.startsWith("image/")) {
          showStatus("Lütfen bir resim dosyası seçin!", "error");
          return;
        }

        if (file.size > 10 * 1024 * 1024) {
          showStatus("Dosya boyutu 10MB'dan küçük olmalıdır!", "error");
          return;
        }

        selectedImage = file;
        const reader = new FileReader();
        reader.onload = function (e) {
          document.getElementById("previewContent").innerHTML = `
                    <img src="${e.target.result}" alt="Seçilen resim">
                    <p style="margin-top: 16px; color: var(--primary); font-weight: 600;">
                        ${file.name}
                    </p>
                `;
        };
        reader.readAsDataURL(file);
      }

      function showStatus(message, type = "loading") {
        const statusBar = document.getElementById("statusBar");
        statusBar.className = `status-bar active ${type}`;

        if (type === "loading") {
          statusBar.innerHTML = `<span class="loading-spinner"></span>${message}`;
        } else {
          statusBar.innerHTML = message;
        }
      }

      function hideStatus() {
        const statusBar = document.getElementById("statusBar");
        statusBar.classList.remove("active");
      }

      async function startSearch() {
        const country = document.getElementById("country").value;
        const searchType = document.querySelector(
          'input[name="searchType"]:checked'
        ).value;
        let sector = "";

        if (searchType === "image") {
          if (!selectedImage) {
            showStatus("Lütfen bir resim seçin!", "error");
            setTimeout(hideStatus, 3000);
            return;
          }

          // Lens türünü al
          const lensType = localStorage.getItem("selectedLens") || "custom";
          const lensName =
            lensType === "custom" ? "Özel Lens Sistemi" : "Google Lens";

          showStatus(`${lensName} ile resim analiz ediliyor...`, "loading");

          const formData = new FormData();
          formData.append("image", selectedImage);
          formData.append("lens_type", lensType);

          try {
            const analyzeResponse = await fetch(
              `${API_URL}/api/analyze_image`,
              {
                method: "POST",
                body: formData,
              }
            );

            const analyzeData = await analyzeResponse.json();

            if (!analyzeData.success) {
              showStatus("Hata: " + analyzeData.error, "error");
              setTimeout(hideStatus, 5000);
              return;
            }

            sector = analyzeData.product;
            document.getElementById("sector").value = sector;

            // Show product tag with lens info
            const productTag = document.getElementById("productTag");
            productTag.textContent = `${sector} (${
              analyzeData.lens_used === "custom" ? "Özel Lens" : "Google Lens"
            })`;
            productTag.style.display = "inline-block";

            // Wait a bit to show the product name
            await new Promise((resolve) => setTimeout(resolve, 1500));
          } catch (error) {
            showStatus("Resim analiz hatası: " + error.message, "error");
            return;
          }
        } else {
          // Keyword search
          sector = document.getElementById("keywordInput").value.trim();

          if (!sector) {
            showStatus("Lütfen bir anahtar kelime girin!", "error");
            setTimeout(hideStatus, 3000);
            return;
          }

          document.getElementById("sector").value = sector;

          // Show product tag
          document.getElementById("productTag").textContent = sector;
          document.getElementById("productTag").style.display = "inline-block";
        }

        // Reset
        allResults = [];
        document.getElementById("resultsBody").innerHTML = "";
        document.getElementById("resultCount").textContent = "0";
        document.getElementById("resultsSection").classList.add("active");
        document.getElementById("emptyState").style.display = "block";

        // Disable button
        document.getElementById("searchBtn").disabled = true;

        showStatus("Arama başlatılıyor...", "loading");

        try {
          const response = await fetch(`${API_URL}/api/start_scan`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              keyword: document.getElementById("sector").value,
              country: country,
            }),
          });

          const data = await response.json();

          if (data.success) {
            currentJobId = data.job_id;
            showStatus("Tarama devam ediyor...", "loading");

            // Start checking status
            statusCheckInterval = setInterval(checkStatus, 1000);
          } else {
            showStatus("Hata: " + (data.error || "Bilinmeyen hata"), "error");
            document.getElementById("searchBtn").disabled = false;
          }
        } catch (error) {
          showStatus("Bağlantı hatası: " + error.message, "error");
          document.getElementById("searchBtn").disabled = false;
        }
      }

      async function checkStatus() {
        if (!currentJobId) return;

        try {
          const response = await fetch(
            `${API_URL}/api/scan_status/${currentJobId}`
          );
          const data = await response.json();

          if (data.status === "error") {
            clearInterval(statusCheckInterval);
            showStatus("Hata: " + (data.error || "Bilinmeyen hata"), "error");
            document.getElementById("searchBtn").disabled = false;
            return;
          }

          // Add new rows
          if (data.new_rows && data.new_rows.length > 0) {
            const tbody = document.getElementById("resultsBody");
            document.getElementById("emptyState").style.display = "none";

            data.new_rows.forEach((row, index) => {
              const tr = document.createElement("tr");
              tr.style.animationDelay = `${index * 0.05}s`;
              tr.innerHTML = `
                            <td>${row[0] || ""}</td>
                            <td>${
                              row[1]
                                ? `<a href="${row[1]}" target="_blank" class="website-link">${row[1]}</a>`
                                : ""
                            }</td>
                        `;
              tbody.appendChild(tr);
              allResults.push(row);
            });

            document.getElementById("resultCount").textContent =
              allResults.length;
          }

          // Update status
          if (data.status === "running") {
            showStatus(
              `Tarama devam ediyor... ${data.rows_found} şirket bulundu`,
              "loading"
            );
          } else if (data.status === "completed") {
            clearInterval(statusCheckInterval);
            showStatus(
              `Tarama tamamlandı! ${data.rows_found} şirket bulundu`,
              "success"
            );
            document.getElementById("searchBtn").disabled = false;

            // Load all results if not already loaded
            if (data.rows && data.rows.length > allResults.length) {
              allResults = data.rows;
              const tbody = document.getElementById("resultsBody");
              tbody.innerHTML = "";
              document.getElementById("emptyState").style.display = "none";

              data.rows.forEach((row, index) => {
                const tr = document.createElement("tr");
                tr.style.animationDelay = `${index * 0.05}s`;
                tr.innerHTML = `
                                <td>${row[0] || ""}</td>
                                <td>${
                                  row[1]
                                    ? `<a href="${row[1]}" target="_blank" class="website-link">${row[1]}</a>`
                                    : ""
                                }</td>
                            `;
                tbody.appendChild(tr);
              });

              document.getElementById("resultCount").textContent =
                allResults.length;
            }

            if (allResults.length === 0) {
              document.getElementById("emptyState").style.display = "block";
            }
          }
        } catch (error) {
          console.error("Status check error:", error);
        }
      }
    </script>
  </body>
</html>
